<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page not found | RE Dev Ops</title>
    <meta name="description" content="The page you are looking for does not exist. Return to the RE Dev Ops home page.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=5">
    <style>
        .nf { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 32px 16px; position: relative; isolation: isolate; overflow: hidden; }
        .nf .dot-grid { z-index: -1; }
        .nf-code { font-family: var(--font-mono); font-size: 13px; color: var(--accent-color); background: var(--accent-soft); padding: 4px 10px; border-radius: 6px; display: inline-block; }
        .nf h1 { font-size: clamp(40px, 7vw, 76px); letter-spacing: -0.045em; line-height: 1; font-weight: 600; margin: 22px 0 16px; }
        .nf h1 .serif { color: var(--text-muted); }
        .nf p { color: var(--text-muted); max-width: 42ch; margin: 0 auto 32px; }
    </style>
</head>
<body>
    <main class="nf">
        <div class="dot-grid" aria-hidden="true"></div>
        <div>
            <span class="nf-code">404</span>
            <h1>Nothing <span class="serif">shipped here.</span></h1>
            <p>This page was moved, renamed or never existed. The rest of the site is still up.</p>
            <a href="/" class="btn btn-accent" id="homeLink"><span aria-hidden="true">←</span> Back to home</a>
        </div>
    </main>
    <script>
        if (location.protocol === 'file:') document.getElementById('homeLink').href = 'index.html';
    </script>
</body>
</html>
